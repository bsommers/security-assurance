[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-assurance"
version = "1.0.0"
description = "Continuous Security Assurance hub uniting NIST SP 800-53r5 + COSIS security-controls, MCP secure-design-patterns, NIST OSCAL 1.1.2 System Security Plans (SSP/SAP/SAR/POA&M), and Open Policy Agent (Rego v1) policy-as-code gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bill Sommers" }]

[project.scripts]
security-assurance = "security_assurance.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/security_assurance"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["T201"]
"src/security_assurance/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "."]
packages = ["security_assurance", "scripts"]
